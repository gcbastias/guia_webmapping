<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 345" role="img" aria-labelledby="title desc"><title id="title">LA ARQUITECTURA DEL CURSO</title><desc id="desc">Petición hacia los datos; respuesta hacia la persona que explora el mapa.</desc><rect width="840" height="345" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="23" fill="#123b46" text-anchor="start">LA ARQUITECTURA DEL CURSO</text><rect x="25.0" y="75" width="243.33333333333334" height="180" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="41.0" y="112" font-size="23" fill="#123b46" text-anchor="start">Visor</text><text x="41.0" y="150" font-size="18" fill="#123b46" text-anchor="start">Leaflet / OpenLayers</text><text x="41.0" y="180" font-size="18" fill="#123b46" text-anchor="start">Interacción</text><text x="283.33333333333337" y="175" font-size="27" fill="#123b46" text-anchor="middle">→</text><rect x="298.33333333333337" y="75" width="243.33333333333334" height="180" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="314.33333333333337" y="112" font-size="23" fill="#123b46" text-anchor="start">Servidor</text><text x="314.33333333333337" y="150" font-size="18" fill="#123b46" text-anchor="start">GeoServer + caché</text><text x="314.33333333333337" y="180" font-size="18" fill="#123b46" text-anchor="start">Publicación</text><text x="556.6666666666667" y="175" font-size="27" fill="#123b46" text-anchor="middle">→</text><rect x="571.6666666666667" y="75" width="243.33333333333334" height="180" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="587.6666666666667" y="112" font-size="23" fill="#123b46" text-anchor="start">Datos</text><text x="587.6666666666667" y="150" font-size="18" fill="#123b46" text-anchor="start">PostGIS / archivos</text><text x="587.6666666666667" y="180" font-size="18" fill="#123b46" text-anchor="start">Almacenamiento</text><text x="30" y="310" font-size="20" fill="#123b46" text-anchor="start">Petición hacia los datos; respuesta hacia la persona que explora el mapa.</text></g></svg>