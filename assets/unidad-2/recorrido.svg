<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" role="img" aria-labelledby="title desc"><title id="title">Recorrido de los datos</title><desc id="desc">Los archivos se importan a PostGIS y QGIS y pgAdmin se conectan a la misma base world.</desc><rect width="840" height="350" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="45" font-size="24" fill="#123b46" text-anchor="start">DEL ARCHIVO A LA CONSULTA ESPACIAL</text><rect x="25" y="85" width="230" height="145" rx="16" fill="white" stroke="none" stroke-width="3"/><text x="45" y="125" font-size="25" fill="#123b46" text-anchor="start">Archivos</text><text x="45" y="165" font-size="19" fill="#123b46" text-anchor="start">SHP · GeoPackage</text><text x="45" y="202" font-size="18" fill="#123b46" text-anchor="start">Datos de entrada</text><rect x="305" y="85" width="230" height="145" rx="16" fill="white" stroke="none" stroke-width="3"/><text x="325" y="125" font-size="25" fill="#123b46" text-anchor="start">PostGIS</text><text x="325" y="165" font-size="19" fill="#123b46" text-anchor="start">Tablas + geometrías</text><text x="325" y="202" font-size="18" fill="#123b46" text-anchor="start">Base world</text><rect x="585" y="85" width="230" height="145" rx="16" fill="white" stroke="none" stroke-width="3"/><text x="605" y="125" font-size="25" fill="#123b46" text-anchor="start">Clientes</text><text x="605" y="165" font-size="19" fill="#123b46" text-anchor="start">QGIS · pgAdmin</text><text x="605" y="202" font-size="18" fill="#123b46" text-anchor="start">Mapa y resultados</text><text x="280" y="165" font-size="30" fill="#123b46" text-anchor="middle">→</text><text x="560" y="165" font-size="30" fill="#123b46" text-anchor="middle">⇄</text><text x="35" y="285" font-size="24" fill="#123b46" text-anchor="start">Importar → almacenar → consultar → visualizar</text><text x="35" y="321" font-size="20" fill="#123b46" text-anchor="start">El visor y el administrador se conectan a la misma base de datos.</text></g></svg>