<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" role="img" aria-labelledby="title desc"><title id="title">Intersección y unión</title><desc id="desc">Dos rectángulos solapados dan una pequeña región común en la intersección y una silueta combinada en la unión.</desc><rect width="840" height="380" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="42" font-size="23" fill="#123b46" text-anchor="start">MISMOS DATOS DE ENTRADA, RESULTADOS DIFERENTES</text><rect x="25" y="70" width="230" height="240" rx="16" fill="white" stroke="none" stroke-width="3"/><text x="40" y="110" font-size="23" fill="#123b46" text-anchor="start">Entrada: A y B</text><rect x="50" y="140" width="110" height="90" rx="0" fill="#a9d2c2" stroke="#176c72" stroke-width="3"/><rect x="110" y="185" width="115" height="90" rx="0" fill="#f4cc9f" stroke="#d77c40" stroke-width="3"/><text x="63" y="175" font-size="22" fill="#123b46" text-anchor="start">A</text><text x="190" y="256" font-size="22" fill="#123b46" text-anchor="start">B</text><rect x="305" y="70" width="230" height="240" rx="16" fill="white" stroke="none" stroke-width="3"/><text x="320" y="110" font-size="23" fill="#123b46" text-anchor="start">Intersección</text><rect x="330" y="140" width="110" height="90" rx="0" fill="none" stroke="#b8c8c1" stroke-width="3"/><rect x="390" y="185" width="115" height="90" rx="0" fill="none" stroke="#b8c8c1" stroke-width="3"/><rect x="390" y="185" width="50" height="45" rx="0" fill="#d77c40" stroke="#d77c40" stroke-width="3"/><rect x="585" y="70" width="230" height="240" rx="16" fill="white" stroke="none" stroke-width="3"/><text x="600" y="110" font-size="23" fill="#123b46" text-anchor="start">Unión</text><rect x="610" y="140" width="110" height="90" rx="0" fill="none" stroke="#b8c8c1" stroke-width="3"/><rect x="670" y="185" width="115" height="90" rx="0" fill="none" stroke="#b8c8c1" stroke-width="3"/><path d="M610 140h110v45h65v90H670v-45H610Z" fill="#a9d2c2" stroke="#176c72" stroke-width="3"/><text x="35" y="352" font-size="21" fill="#123b46" text-anchor="start">Intersection: solo lo compartido. Union: toda la cobertura.</text></g></svg>