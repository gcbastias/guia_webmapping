<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" role="img" aria-labelledby="title desc"><title id="title">Asignar SRID frente a transformar</title><desc id="desc">ST_SetSRID conserva números y etiqueta el sistema. ST_Transform recalcula las coordenadas a otro sistema.</desc><rect width="840" height="350" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="42" font-size="22" fill="#123b46" text-anchor="start">ASIGNAR UNA ETIQUETA ≠ TRANSFORMAR COORDENADAS</text><rect x="25" y="70" width="380" height="215" rx="16" fill="white" stroke="none" stroke-width="3"/><text x="45" y="112" font-size="26" fill="#123b46" text-anchor="start">ST_SetSRID</text><rect x="435" y="70" width="380" height="215" rx="16" fill="white" stroke="none" stroke-width="3"/><text x="455" y="112" font-size="26" fill="#123b46" text-anchor="start">ST_Transform</text><text x="45" y="155" font-size="25" fill="#123b46" text-anchor="start">(-3.68, 40.40)</text><text x="45" y="198" font-size="22" fill="#176c72" text-anchor="start">Mismos números</text><text x="45" y="242" font-size="19" fill="#123b46" text-anchor="start">Añade o corrige la referencia.</text><text x="455" y="155" font-size="22" fill="#123b46" text-anchor="start">Longitud / latitud → X / Y</text><text x="455" y="198" font-size="22" fill="#176c72" text-anchor="start">Nuevas coordenadas</text><text x="455" y="242" font-size="19" fill="#123b46" text-anchor="start">Recalcula en otro sistema.</text><text x="35" y="327" font-size="22" fill="#123b46" text-anchor="start">El sistema de origen debe ser conocido y correcto.</text></g></svg>