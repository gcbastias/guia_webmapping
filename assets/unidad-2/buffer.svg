<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" role="img" aria-labelledby="title desc"><title id="title">Buffer sobre un punto y una línea</title><desc id="desc">Un punto produce un disco y una línea un corredor. El radio d usa las unidades de la operación, no necesariamente metros.</desc><rect width="840" height="400" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="42" font-size="23" fill="#123b46" text-anchor="start">BUFFER: DISTANCIA ALREDEDOR DE UNA GEOMETRÍA</text><circle cx="210" cy="185" r="95" fill="#c2ddd1" stroke="#176c72" stroke-width="3"/><circle cx="210" cy="185" r="8" fill="#d77c40" stroke="#d77c40" stroke-width="3"/><path d="M210 185L305 185" stroke="#d77c40" stroke-width="3" fill="none" /><text x="245" y="170" font-size="25" fill="#d77c40" text-anchor="start">d</text><text x="90" y="315" font-size="23" fill="#123b46" text-anchor="start">Punto → superficie</text><path d="M490 220L580 125L720 200" fill="none" stroke="#c2ddd1" stroke-width="70" stroke-linejoin="round" stroke-linecap="round"/><path d="M490 220L580 125L720 200" fill="none" stroke="#176c72" stroke-width="5"/><text x="470" y="315" font-size="23" fill="#123b46" text-anchor="start">Línea → corredor</text><text x="35" y="370" font-size="21" fill="#123b46" text-anchor="start">En la práctica original: d = 2 grados sobre la capa cities.</text></g></svg>