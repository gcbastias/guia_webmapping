<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" role="img" aria-labelledby="title desc"><title id="title">Parejas de capa y fuente</title><desc id="desc">Las capas definen presentación y visibilidad; las fuentes aportan contenido de distintos orígenes.</desc><rect width="840" height="380" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="22" fill="#123b46" text-anchor="start">LAYER Y SOURCE RESPONDEN PREGUNTAS DISTINTAS</text><rect x="25" y="70" width="300" height="65" rx="14" fill="#a9d2c2" stroke="none" stroke-width="2"/><text x="45" y="110" font-size="23" fill="#123b46" text-anchor="start">TileLayer</text><text x="385" y="110" font-size="30" fill="#123b46" text-anchor="start">←</text><rect x="445" y="70" width="370" height="65" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="465" y="110" font-size="21" fill="#123b46" text-anchor="start">OSM / TileWMS</text><rect x="25" y="150" width="300" height="65" rx="14" fill="#a9d2c2" stroke="none" stroke-width="2"/><text x="45" y="190" font-size="23" fill="#123b46" text-anchor="start">ImageLayer</text><text x="385" y="190" font-size="30" fill="#123b46" text-anchor="start">←</text><rect x="445" y="150" width="370" height="65" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="465" y="190" font-size="21" fill="#123b46" text-anchor="start">ImageWMS</text><rect x="25" y="230" width="300" height="65" rx="14" fill="#a9d2c2" stroke="none" stroke-width="2"/><text x="45" y="270" font-size="23" fill="#123b46" text-anchor="start">VectorLayer</text><text x="385" y="270" font-size="30" fill="#123b46" text-anchor="start">←</text><rect x="445" y="230" width="370" height="65" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="465" y="270" font-size="21" fill="#123b46" text-anchor="start">VectorSource + GeoJSON</text><text x="35" y="345" font-size="20" fill="#123b46" text-anchor="start">Layer: cómo se presenta. Source: de dónde obtiene el contenido.</text></g></svg>