<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 365" role="img" aria-labelledby="title desc"><title id="title">Parámetros de una petición WMS</title><desc id="desc">Cinco grupos de parámetros organizan servicio, capas, referencia espacial, tamaño y formato.</desc><rect width="840" height="365" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="24" fill="#123b46" text-anchor="start">LEER UNA PETICIÓN GETMAP</text><rect x="25" y="60" width="790" height="46" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="43" y="90" font-size="21" fill="#123b46" text-anchor="start">SERVICE / REQUEST</text><text x="400" y="90" font-size="21" fill="#123b46" text-anchor="start">WMS / GetMap</text><rect x="25" y="115" width="790" height="46" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="43" y="145" font-size="21" fill="#123b46" text-anchor="start">LAYERS / STYLES</text><text x="400" y="145" font-size="21" fill="#123b46" text-anchor="start">Qué dibujar y cómo</text><rect x="25" y="170" width="790" height="46" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="43" y="200" font-size="21" fill="#123b46" text-anchor="start">CRS / BBOX</text><text x="400" y="200" font-size="21" fill="#123b46" text-anchor="start">Referencia y zona visible</text><rect x="25" y="225" width="790" height="46" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="43" y="255" font-size="21" fill="#123b46" text-anchor="start">WIDTH / HEIGHT</text><text x="400" y="255" font-size="21" fill="#123b46" text-anchor="start">Dimensiones de salida</text><rect x="25" y="280" width="790" height="46" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="43" y="310" font-size="21" fill="#123b46" text-anchor="start">FORMAT</text><text x="400" y="310" font-size="21" fill="#123b46" text-anchor="start">Formato de la imagen</text></g></svg>