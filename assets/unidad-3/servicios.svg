<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 365" role="img" aria-labelledby="title desc"><title id="title">Cuatro servicios OGC</title><desc id="desc">WMS sirve una representación; WFS entidades; WCS coberturas; WPS permite ejecutar procesos.</desc><rect width="840" height="365" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="23" fill="#123b46" text-anchor="start">EL SERVICIO DETERMINA LA RESPUESTA</text><rect x="25" y="70" width="380" height="120" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="45" y="108" font-size="27" fill="#123b46" text-anchor="start">WMS</text><text x="45" y="152" font-size="22" fill="#123b46" text-anchor="start">Imagen de mapa</text><rect x="435" y="70" width="380" height="120" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="455" y="108" font-size="27" fill="#123b46" text-anchor="start">WFS</text><text x="455" y="152" font-size="22" fill="#123b46" text-anchor="start">Entidades y atributos</text><rect x="25" y="215" width="380" height="120" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="45" y="253" font-size="27" fill="#123b46" text-anchor="start">WCS</text><text x="45" y="297" font-size="22" fill="#123b46" text-anchor="start">Cobertura y valores</text><rect x="435" y="215" width="380" height="120" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="455" y="253" font-size="27" fill="#123b46" text-anchor="start">WPS</text><text x="455" y="297" font-size="22" fill="#123b46" text-anchor="start">Resultado de un proceso</text></g></svg>