<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc"><title id="title">Organización de GeoServer</title><desc id="desc">Un espacio earth agrupa el almacén world y sus capas; los estilos definen la representación.</desc><rect width="840" height="360" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="23" fill="#123b46" text-anchor="start">WORKSPACE → STORE → LAYER → STYLE</text><rect x="30" y="75" width="780" height="255" rx="14" fill="white" stroke="#176c72" stroke-width="2"/><text x="52" y="112" font-size="25" fill="#123b46" text-anchor="start">workspace: earth</text><rect x="55" y="135" width="330" height="160" rx="14" fill="#eef5f1" stroke="none" stroke-width="2"/><text x="75" y="170" font-size="22" fill="#123b46" text-anchor="start">store: world (PostGIS)</text><rect x="75" y="182" width="280" height="38" rx="14" fill="#a9d2c2" stroke="none" stroke-width="2"/><text x="90" y="207" font-size="21" fill="#123b46" text-anchor="start">layer: countries</text><rect x="75" y="230" width="280" height="38" rx="14" fill="#a9d2c2" stroke="none" stroke-width="2"/><text x="90" y="255" font-size="21" fill="#123b46" text-anchor="start">layer: cities</text><rect x="450" y="165" width="320" height="100" rx="14" fill="#f8e4cb" stroke="none" stroke-width="2"/><text x="470" y="205" font-size="23" fill="#123b46" text-anchor="start">style: simbología</text><text x="470" y="240" font-size="19" fill="#123b46" text-anchor="start">color · tamaño · etiquetas</text><path d="M355 210H450" fill="none" stroke="#176c72" stroke-width="4"/></g></svg>