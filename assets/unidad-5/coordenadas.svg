<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="title desc"><title id="title">Coordenadas y radios</title><desc id="desc">Leaflet LatLng y GeoJSON usan órdenes distintos; circle y circleMarker usan radios distintos.</desc><rect width="840" height="340" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="24" fill="#123b46" text-anchor="start">NO CONFUNDIR ORDEN NI UNIDADES</text><rect x="25" y="65" width="790" height="75" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="45" y="100" font-size="23" fill="#123b46" text-anchor="start">Leaflet LatLng</text><text x="365" y="100" font-size="21" fill="#123b46" text-anchor="start">[latitud, longitud]</text><rect x="25" y="155" width="790" height="75" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="45" y="190" font-size="23" fill="#123b46" text-anchor="start">GeoJSON</text><text x="365" y="190" font-size="21" fill="#123b46" text-anchor="start">[longitud, latitud]</text><rect x="25" y="245" width="790" height="75" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="45" y="280" font-size="23" fill="#123b46" text-anchor="start">Circle / circleMarker</text><text x="365" y="280" font-size="21" fill="#123b46" text-anchor="start">radio geográfico / radio en píxeles</text></g></svg>