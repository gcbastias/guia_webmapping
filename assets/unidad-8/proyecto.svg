<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" role="img" aria-labelledby="title desc"><title id="title">Arquitectura solicitada en el proyecto final</title><desc id="desc">Demarcación y ríos se sirven por WMS; los embalses se representan como GeoJSON en Leaflet.</desc><rect width="840" height="380" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="23" fill="#123b46" text-anchor="start">ARQUITECTURA DEL PROYECTO ORIGINAL</text><rect x="25" y="75" width="230" height="220" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="45" y="115" font-size="26" fill="#123b46" text-anchor="start">PostGIS</text><text x="45" y="165" font-size="21" fill="#123b46" text-anchor="start">Demarcación</text><text x="45" y="205" font-size="21" fill="#123b46" text-anchor="start">Segmentos de río</text><rect x="305" y="75" width="230" height="220" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="325" y="115" font-size="25" fill="#123b46" text-anchor="start">GeoServer</text><text x="325" y="165" font-size="21" fill="#123b46" text-anchor="start">Estilos CSS</text><text x="325" y="205" font-size="20" fill="#123b46" text-anchor="start">Publicación WMS</text><rect x="585" y="75" width="230" height="220" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="605" y="115" font-size="26" fill="#123b46" text-anchor="start">Leaflet</text><text x="605" y="165" font-size="20" fill="#123b46" text-anchor="start">WMS + GeoJSON</text><text x="605" y="205" font-size="20" fill="#123b46" text-anchor="start">Base y controles</text><text x="280" y="190" font-size="28" fill="#123b46" text-anchor="middle">→</text><text x="560" y="190" font-size="28" fill="#123b46" text-anchor="middle">→</text><text x="35" y="345" font-size="21" fill="#123b46" text-anchor="start">Embalses → GeoJSON → Leaflet (ruta vectorial en el cliente).</text></g></svg>