<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 335" role="img" aria-labelledby="title desc"><title id="title">Configuración de contexto</title><desc id="desc">Un contexto reúne mapa inicial, catálogos, complementos y apariencia.</desc><rect width="840" height="335" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="23" fill="#123b46" text-anchor="start">UN CONTEXTO CONFIGURA LA EXPERIENCIA</text><rect x="260" y="70" width="320" height="65" rx="14" fill="#a9d2c2" stroke="none" stroke-width="2"/><text x="420" y="112" font-size="27" fill="#123b46" text-anchor="middle">Contexto</text><path d="M420 135V165H115V190" fill="none" stroke="#176c72" stroke-width="4"/><rect x="20" y="190" width="185" height="110" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="35" y="228" font-size="21" fill="#123b46" text-anchor="start">Mapa inicial</text><text x="35" y="270" font-size="18" fill="#123b46" text-anchor="start">Capas y fondos</text><path d="M420 135V165H320V190" fill="none" stroke="#176c72" stroke-width="4"/><rect x="225" y="190" width="185" height="110" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="240" y="228" font-size="21" fill="#123b46" text-anchor="start">Catálogos</text><text x="240" y="270" font-size="18" fill="#123b46" text-anchor="start">Fuentes disponibles</text><path d="M420 135V165H525V190" fill="none" stroke="#176c72" stroke-width="4"/><rect x="430" y="190" width="185" height="110" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="445" y="228" font-size="21" fill="#123b46" text-anchor="start">Complementos</text><text x="445" y="270" font-size="18" fill="#123b46" text-anchor="start">Herramientas</text><path d="M420 135V165H730V190" fill="none" stroke="#176c72" stroke-width="4"/><rect x="635" y="190" width="185" height="110" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="650" y="228" font-size="21" fill="#123b46" text-anchor="start">Tema</text><text x="650" y="270"