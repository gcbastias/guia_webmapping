<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 405" role="img" aria-labelledby="title desc"><title id="title">Usuarios y acceso</title><desc id="desc">Los roles se combinan con permisos de los recursos; publicar un enlace no cambia esos permisos.</desc><rect width="840" height="405" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="22" fill="#123b46" text-anchor="start">ACCESO AL RECURSO ≠ PERMISO PARA EDITARLO</text><rect x="25" y="65" width="790" height="65" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="45" y="105" font-size="24" fill="#123b46" text-anchor="start">Anónimo</text><text x="365" y="105" font-size="22" fill="#123b46" text-anchor="start">Recursos públicos</text><rect x="25" y="150" width="790" height="65" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="45" y="190" font-size="24" fill="#123b46" text-anchor="start">Usuario</text><text x="365" y="190" font-size="22" fill="#123b46" text-anchor="start">Recursos autorizados</text><rect x="25" y="235" width="790" height="65" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="45" y="275" font-size="24" fill="#123b46" text-anchor="start">Administrador</text><text x="365" y="275" font-size="22" fill="#123b46" text-anchor="start">Gestión y configuración</text><text x="35" y="370" font-size="20" fill="#123b46" text-anchor="start">La visibilidad final depende de roles, grupos y permisos del recurso.</text></g></svg>