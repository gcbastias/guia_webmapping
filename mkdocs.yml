site_name: Guía visual de Webmapping
site_url: https://gcbastias.github.io/guia_webmapping/
site_description: Resumen estructurado, ejercicios prácticos y glosario del curso de Desarrollo de Aplicaciones Webmapping (MappingGIS)
site_author: Gabriela
repo_name: guia_webmapping
repo_url: https://github.com/gcbastias/guia_webmapping

extra_css:
  - stylesheets/extra.css
  - stylesheets/piloto.css

theme:
  name: material
  language: es
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: orange
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - Inicio: index.md
  - Unidades:
      - "Unidad 1. Del dato al mapa web": unidades/unidad-1.md
      - "Unidad 2. PostGIS": unidades/unidad-2.md
      - "Unidad 3. GeoServer y OGC": unidades/unidad-3.md
      - "Unidad 4. GeoWebCache": unidades/unidad-4.md
      - "Unidad 5. Web y Leaflet": unidades/unidad-5.md
      - "Unidad 6. OpenLayers": unidades/unidad-6.md
      - "Unidad 7. MapStore": unidades/unidad-7.md
      - "Unidad 8. Proyecto y publicación": unidades/unidad-8.md
  - Glosario: glosario.md

markdown_extensions:
  - toc:
      permalink: false
      toc_depth: 3
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

plugins:
  - search:
      lang: es

extra:
  social: []
