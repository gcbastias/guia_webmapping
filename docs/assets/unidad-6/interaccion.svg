<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 385" role="img" aria-labelledby="title desc"><title id="title">Controles y gestos</title><desc id="desc">Controles visibles de zoom y una línea dibujada ilustran la distinción.</desc><rect width="840" height="385" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="24" fill="#123b46" text-anchor="start">CONTROLES E INTERACCIONES</text><rect x="25" y="75" width="490" height="230" rx="14" fill="#dcebe5" stroke="none" stroke-width="2"/><path d="M40 280L485 100" fill="none" stroke="white" stroke-width="15"/><path d="M45 120L475 285" fill="none" stroke="white" stroke-width="12"/><path d="M299.40000000000003 75Q221.0 155 328.8 305" fill="none" stroke="#9bc9d4" stroke-width="20"/><rect x="50" y="100" width="55" height="80" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="77" y="130" font-size="25" fill="#123b46" text-anchor="middle">+</text><text x="77" y="167" font-size="25" fill="#123b46" text-anchor="middle">−</text><path d="M180 240L240 160L340 210" fill="none" stroke="#d77c40" stroke-width="5"/><circle cx="180" cy="240" r="7" fill="#d77c40"/><circle cx="240" cy="160" r="7" fill="#d77c40"/><circle cx="340" cy="210" r="7" fill="#d77c40"/><text x="550" y="120" font-size="25" fill="#123b46" text-anchor="start">Control</text><text x="550" y="155" font-size="20" fill="#123b46" text-anchor="start">Botón o indicador</text><text x="550" y="220" font-size="25" fill="#123b46" text-anchor="start">Interacción</text><text x="550" y="255" font-size="19" fill="#123b46" text-anchor="start">Acción sobre el mapa</text><text x="35" y="350" font-size="20" fill="#123b46" text-anchor="start">Ejemplos: escala / pantalla completa frente a seleccionar / dibujar.</text></g></svg>