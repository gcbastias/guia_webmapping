<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 370" role="img" aria-labelledby="title desc"><title id="title">Documento y contenedor</title><desc id="desc">El HTML declara el contenedor y JavaScript inicializa el mapa dentro de él.</desc><rect width="840" height="370" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="24" fill="#123b46" text-anchor="start">DEL DOCUMENTO AL OBJETO MAPA</text><rect x="25" y="75" width="790" height="220" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="50" y="115" font-size="25" fill="#123b46" text-anchor="start">html</text><path d="M80 130V245H160" fill="none" stroke="#176c72" stroke-width="4"/><text x="110" y="165" font-size="22" fill="#123b46" text-anchor="start">head → CSS y metadatos</text><text x="110" y="205" font-size="22" fill="#123b46" text-anchor="start">body → div id=&quot;map&quot;</text><text x="170" y="255" font-size="22" fill="#123b46" text-anchor="start">JavaScript → L.map(&quot;map&quot;)</text><text x="35" y="338" font-size="20" fill="#123b46" text-anchor="start">El elemento debe existir y tener altura antes de que el mapa se vea.</text></g></svg>