<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 425" role="img" aria-labelledby="title desc"><title id="title">Composición del mapa</title><desc id="desc">Tres planos separados representan fondo, WMS y GeoJSON; los rótulos están fuera de las superficies.</desc><rect width="840" height="425" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="23" fill="#123b46" text-anchor="start">CAPAS QUE SE COMPONEN EN EL VISOR</text><path d="M35 260l240 -50l190 65l-240 50Z" fill="#d1e3dd" stroke="#176c72" stroke-width="3"/><path d="M55 205l240 -50l190 65l-240 50Z" fill="#b2d1c3" stroke="#176c72" stroke-width="3"/><path d="M75 150l240 -50l190 65l-240 50Z" fill="#8cb9ac" stroke="#176c72" stroke-width="3"/><text x="565" y="145" font-size="21" fill="#123b46" text-anchor="start">Objetos · GeoJSON</text><path d="M505 165L545 138" fill="none" stroke="#176c72" stroke-width="2"/><text x="565" y="225" font-size="21" fill="#123b46" text-anchor="start">Temática · WMS</text><path d="M485 220L545 218" fill="none" stroke="#176c72" stroke-width="2"/><text x="565" y="305" font-size="21" fill="#123b46" text-anchor="start">Fondo · teselas</text><path d="M465 275L545 298" fill="none" stroke="#176c72" stroke-width="2"/><text x="35" y="390" font-size="20" fill="#123b46" text-anchor="start">Orden y transparencia determinan qué información se ve.</text></g></svg>