<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" role="img" aria-labelledby="title desc"><title id="title">De filas a entidades</title><desc id="desc">Tres filas con identificador, nombre y geometría corresponden a tres puntos numerados en un mapa esquemático sin ubicación real.</desc><rect width="840" height="350" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="42" font-size="24" fill="#123b46" text-anchor="start">LA MISMA INFORMACIÓN, DOS VISTAS</text><rect x="25" y="70" width="435" height="220" rx="16" fill="white" stroke="none" stroke-width="3"/><text x="45" y="109" font-size="21" fill="#123b46" text-anchor="start">gid     nombre             geom</text><path d="M45 123L440 123" stroke="#176c72" stroke-width="3" fill="none" /><text x="45" y="160" font-size="19" fill="#123b46" text-anchor="start">1        Madrid              POINT(...)</text><text x="45" y="210" font-size="19" fill="#123b46" text-anchor="start">2        Phoenix            POINT(...)</text><text x="45" y="260" font-size="19" fill="#123b46" text-anchor="start">3        Tokio                 POINT(...)</text><rect x="490" y="70" width="325" height="220" rx="16" fill="#dcebe5" stroke="none" stroke-width="3"/><path d="M510 260L790 100" stroke="white" stroke-width="3" fill="none" /><path d="M515 120L780 240" stroke="white" stroke-width="3" fill="none" /><circle cx="555" cy="140" r="11" fill="#d77c40" stroke="white" stroke-width="3"/><text x="572" y="132" font-size="21" fill="#123b46" text-anchor="start">1</text><circle cx="660" cy="210" r="11" fill="#d77c40" stroke="white" stroke-width="3"/><text x="677" y="202" font-size="21" fill="#123b46" text-anchor="start">2</text><circle cx="750" cy="120" r="11" fill="#d77c40" stroke="white" stroke-width="3"/><text x="767" y="112" font-size="21" fill="#123b46" text-anchor="start">3</text><text x="35" y="330" font-size="21" fill="#123b46" text-anchor="start">Cada fila aporta atributos; geom permite situarla en el mapa.</text></g></svg>