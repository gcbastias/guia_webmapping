<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 365" role="img" aria-labelledby="title desc"><title id="title">Tres tipos de resultados</title><desc id="desc">Las comparaciones producen booleanos; las mediciones números; las operaciones de construcción geometrías.</desc><rect width="840" height="365" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="42" font-size="23" fill="#123b46" text-anchor="start">MAPA DE DECISIÓN: ¿QUÉ RESULTADO NECESITAS?</text><rect x="25" y="85" width="790" height="75" rx="16" fill="white" stroke="none" stroke-width="3"/><text x="43" y="114" font-size="22" fill="#123b46" text-anchor="start">Una respuesta sí/no</text><text x="43" y="142" font-size="18" fill="#123b46" text-anchor="start">Intersects · Contains · DWithin</text><text x="785" y="130" font-size="20" fill="#176c72" text-anchor="end">BOOLEANO</text><rect x="25" y="175" width="790" height="75" rx="16" fill="white" stroke="none" stroke-width="3"/><text x="43" y="204" font-size="22" fill="#123b46" text-anchor="start">Una medida</text><text x="43" y="232" font-size="18" fill="#123b46" text-anchor="start">Distance · Area · Length</text><text x="785" y="220" font-size="20" fill="#176c72" text-anchor="end">NÚMERO</text><rect x="25" y="265" width="790" height="75" rx="16" fill="white" stroke="none" stroke-width="3"/><text x="43" y="294" font-size="22" fill="#123b46" text-anchor="start">Una nueva forma</text><text x="43" y="322" font-size="18" fill="#123b46" text-anchor="start">Buffer · Intersection · Union</text><text x="785" y="310" font-size="20" fill="#176c72" text-anchor="end">GEOMETRÍA</text></g></svg>