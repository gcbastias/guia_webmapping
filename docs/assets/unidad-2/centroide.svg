<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" role="img" aria-labelledby="title desc"><title id="title">Centroide frente a punto interior</title><desc id="desc">Dos polígonos en forma de C. El centroide cae en la concavidad, fuera del polígono; un punto sobre la superficie queda en la barra vertical.</desc><rect width="840" height="410" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="42" font-size="24" fill="#123b46" text-anchor="start">CENTRO GEOMÉTRICO Y PUNTO INTERIOR</text><rect x="25" y="65" width="380" height="270" rx="16" fill="white" stroke="none" stroke-width="3"/><path d="M70 95h220v55H125v80h165v55H70Z" fill="#a9d2c2" stroke="#176c72" stroke-width="3"/><text x="45" y="320" font-size="23" fill="#123b46" text-anchor="start">ST_Centroid</text><rect x="440" y="65" width="380" height="270" rx="16" fill="white" stroke="none" stroke-width="3"/><path d="M485 95h220v55H540v80h165v55H485Z" fill="#a9d2c2" stroke="#176c72" stroke-width="3"/><text x="460" y="320" font-size="23" fill="#123b46" text-anchor="start">ST_PointOnSurface</text><circle cx="150" cy="190" r="9" fill="#d77c40" stroke="#d77c40" stroke-width="3"/><text x="175" y="193" font-size="20" fill="#d77c40" text-anchor="start">Fuera</text><circle cx="505" cy="190" r="9" fill="#d77c40" stroke="#d77c40" stroke-width="3"/><text x="540" y="193" font-size="20" fill="#176c72" text-anchor="start">Dentro</text><text x="35" y="380" font-size="21" fill="#123b46" text-anchor="start">Un centroide puede quedar en el hueco de una forma cóncava.</text></g></svg>