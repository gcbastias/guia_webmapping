<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 370" role="img" aria-labelledby="title desc"><title id="title">Flujo conceptual SQL</title><desc id="desc">FROM determina la tabla, WHERE filtra filas y SELECT decide las columnas o cálculos de salida.</desc><rect width="840" height="370" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="42" font-size="23" fill="#123b46" text-anchor="start">UNA CONSULTA REDUCE Y TRANSFORMA INFORMACIÓN</text><rect x="25" y="70" width="235" height="235" rx="16" fill="white" stroke="none" stroke-width="3"/><text x="43" y="108" font-size="26" fill="#123b46" text-anchor="start">FROM</text><text x="43" y="140" font-size="18" fill="#123b46" text-anchor="start">Tabla de entrada</text><rect x="43" y="160" width="199" height="19" rx="4" fill="#a9d2c2" stroke="none" stroke-width="3"/><rect x="43" y="189" width="199" height="19" rx="4" fill="#a9d2c2" stroke="none" stroke-width="3"/><rect x="43" y="218" width="199" height="19" rx="4" fill="#a9d2c2" stroke="none" stroke-width="3"/><rect x="43" y="247" width="199" height="19" rx="4" fill="#a9d2c2" stroke="none" stroke-width="3"/><rect x="305" y="70" width="230" height="235" rx="16" fill="white" stroke="none" stroke-width="3"/><text x="323" y="108" font-size="26" fill="#123b46" text-anchor="start">WHERE</text><text x="323" y="140" font-size="18" fill="#123b46" text-anchor="start">Filas que cumplen</text><rect x="323" y="160" width="194" height="19" rx="4" fill="#a9d2c2" stroke="none" stroke-width="3"/><rect x="323" y="218" width="194" height="19" rx="4" fill="#a9d2c2" stroke="none" stroke-width="3"/><rect x="580" y="70" width="235" height="235" rx="16" fill="white" stroke="none" stroke-width="3"/><text x="598" y="108" font-size="26" fill="#123b46" text-anchor="start">SELECT</text><text x="598" y="140" font-size="18" fill="#123b46" text-anchor="start">Columnas y cálculos</text><rect x="598" y="160" width="199" height="19" rx="4" fill="#f3cf9c" stroke="none" stroke-width="3"/><rect x="598" y="189" width="199" height="19" rx="4" fill="#f3cf9c" stroke="none" stroke-width="3"/><rect x="598" y="218" width="199" height="19" rx="4" fill="#f3cf9c" stroke="none" stroke-width="3"/><rect x="598" y="247" width="199" height="19" rx="4" fill="#f3cf9c" stroke="none" stroke-width="3"/><text x="281" y="210" font-size="28" fill="#123b46" text-anchor="middle">→</text><text x="557" y="210" font-size="28" fill="#123b46" text-anchor="middle">→</text><text x="35" y="343" font-size="19" fill="#123b46" text-anchor="start">Lectura conceptual; la consulta se escribe empezando por SELECT.</text></g></svg>