<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 395" role="img" aria-labelledby="title desc"><title id="title">Crecimiento de teselas</title><desc id="desc">Barras de 1, 4, 16 y 64 teselas; valores teóricos, no mediciones del curso.</desc><rect width="840" height="395" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="23" fill="#123b46" text-anchor="start">COSTE ILUSTRATIVO POR NIVEL DE ZOOM</text><text x="35" y="106" font-size="21" fill="#123b46" text-anchor="start">z0</text><rect x="100" y="85" width="8.5" height="28" rx="4" fill="#176c72" stroke="none" stroke-width="2"/><text x="128.5" y="107" font-size="21" fill="#123b46" text-anchor="start">1</text><text x="35" y="161" font-size="21" fill="#123b46" text-anchor="start">z1</text><rect x="100" y="140" width="34.0" height="28" rx="4" fill="#176c72" stroke="none" stroke-width="2"/><text x="154.0" y="162" font-size="21" fill="#123b46" text-anchor="start">4</text><text x="35" y="216" font-size="21" fill="#123b46" text-anchor="start">z2</text><rect x="100" y="195" width="136.0" height="28" rx="4" fill="#176c72" stroke="none" stroke-width="2"/><text x="256.0" y="217" font-size="21" fill="#123b46" text-anchor="start">16</text><text x="35" y="271" font-size="21" fill="#123b46" text-anchor="start">z3</text><rect x="100" y="250" width="544.0" height="28" rx="4" fill="#176c72" stroke="none" stroke-width="2"/><text x="664.0" y="272" font-size="21" fill="#123b46" text-anchor="start">64</text><text x="35" y="335" font-size="19" fill="#123b46" text-anchor="start">Solo para una cobertura completa del modelo 1 → 4 → 16 → 64.</text><text x="35" y="365" font-size="20" fill="#123b46" text-anchor="start">Almacenamiento total ≈ cantidad de teselas × tamaño medio.</text></g></svg>