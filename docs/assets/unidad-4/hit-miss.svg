<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" role="img" aria-labelledby="title desc"><title id="title">Acierto y fallo de caché</title><desc id="desc">El acierto devuelve la copia; el fallo solicita al servidor una tesela y la guarda.</desc><rect width="840" height="390" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="23" fill="#123b46" text-anchor="start">DOS CAMINOS PARA LA MISMA TESELA</text><rect x="25" y="75" width="205" height="190" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="45" y="118" font-size="25" fill="#123b46" text-anchor="start">Cliente</text><text x="45" y="160" font-size="21" fill="#123b46" text-anchor="start">Pide z / x / y</text><rect x="300" y="75" width="230" height="190" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="320" y="118" font-size="24" fill="#123b46" text-anchor="start">GeoWebCache</text><text x="320" y="160" font-size="20" fill="#123b46" text-anchor="start">¿Está guardada?</text><rect x="605" y="75" width="210" height="190" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="625" y="118" font-size="24" fill="#123b46" text-anchor="start">GeoServer</text><text x="625" y="160" font-size="18" fill="#123b46" text-anchor="start">Dibuja y devuelve</text><path d="M230 170H300" fill="none" stroke="#176c72" stroke-width="4"/><path d="M530 170H605" fill="none" stroke="#d77c40" stroke-width="4"/><text x="558" y="152" font-size="18" fill="#d77c40" text-anchor="middle">NO</text><path d="M415 265V310H125V265" fill="none" stroke="#176c72" stroke-width="4"/><text x="240" y="300" font-size="19" fill="#123b46" text-anchor="start">SÍ → devolver copia</text><text x="35" y="355" font-size="20" fill="#123b46" text-anchor="start">Al recibir una tesela nueva, la caché la guarda para otra petición.</text></g></svg>