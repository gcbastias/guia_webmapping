<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 355" role="img" aria-labelledby="title desc"><title id="title">Pregeneración y demanda</title><desc id="desc">El orden de visita y generación distingue las dos estrategias.</desc><rect width="840" height="355" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="24" fill="#123b46" text-anchor="start">CUÁNDO GENERAR LAS TESELAS</text><text x="35" y="90" font-size="22" fill="#123b46" text-anchor="start">Pregenerar</text><rect x="225" y="57" width="175" height="62" rx="14" fill="#a9d2c2" stroke="none" stroke-width="2"/><text x="312" y="96" font-size="19" fill="#123b46" text-anchor="middle">Generar</text><rect x="420" y="57" width="175" height="62" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="507" y="96" font-size="19" fill="#123b46" text-anchor="middle">Guardar</text><rect x="615" y="57" width="175" height="62" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="702" y="96" font-size="19" fill="#123b46" text-anchor="middle">Primera visita</text><text x="35" y="205" font-size="22" fill="#123b46" text-anchor="start">Bajo demanda</text><rect x="225" y="172" width="175" height="62" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="312" y="211" font-size="19" fill="#123b46" text-anchor="middle">Primera visita</text><rect x="420" y="172" width="175" height="62" rx="14" fill="#a9d2c2" stroke="none" stroke-width="2"/><text x="507" y="211" font-size="19" fill="#123b46" text-anchor="middle">Generar</text><rect x="615" y="172" width="175" height="62" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="702" y="211" font-size="19" fill="#123b46" text-anchor="middle">Guardar</text><text x="35" y="320" font-size="20" fill="#123b46" text-anchor="start">Se pueden combinar: zonas frecuentes primero; resto bajo demanda.</text></g></svg>