<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" role="img" aria-labelledby="title desc"><title id="title">Lectura del visor final</title><desc id="desc">Una maqueta muestra límite sin relleno, río y embalses azules; no es cartografía real.</desc><rect width="840" height="390" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="23" fill="#123b46" text-anchor="start">JERARQUÍA VISUAL: FONDO, TEMA Y CONTROLES</text><rect x="25" y="75" width="545" height="235" rx="14" fill="#dcebe5" stroke="none" stroke-width="2"/><path d="M40 285L540 100" fill="none" stroke="white" stroke-width="15"/><path d="M45 120L530 290" fill="none" stroke="white" stroke-width="12"/><path d="M330.20000000000005 75Q243.0 155 362.9 310" fill="none" stroke="#9bc9d4" stroke-width="20"/><path d="M80 120L425 100L515 260L160 285Z" fill="none" stroke="#176c72" stroke-width="3" stroke-dasharray="8 6"/><path d="M220 110Q175 180 325 275" fill="none" stroke="#2d78a4" stroke-width="6"/><circle cx="240" cy="185" r="12" fill="#2676b5"/><circle cx="300" cy="225" r="9" fill="#2676b5"/><rect x="600" y="75" width="215" height="235" rx="14" fill="white" stroke="none" stroke-width="2"/><text x="620" y="115" font-size="23" fill="#123b46" text-anchor="start">Lectura clara</text><text x="620" y="165" font-size="18" fill="#123b46" text-anchor="start">Límite sin relleno</text><text x="620" y="205" font-size="18" fill="#123b46" text-anchor="start">Ríos etiquetados</text><text x="620" y="245" font-size="18" fill="#123b46" text-anchor="start">Embalses azules</text><text x="35" y="355" font-size="20" fill="#123b46" text-anchor="start">Maqueta conceptual: no representa la demarcación real del Duero.</text></g></svg>