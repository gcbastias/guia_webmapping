<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 425" role="img" aria-labelledby="title desc"><title id="title">Distribución de un dashboard</title><desc id="desc">Un mapa principal se combina con título, gráfico y leyenda; esquema sin datos reales.</desc><rect width="840" height="425" rx="20" fill="#eef5f1"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="23" fill="#123b46" text-anchor="start">UN PANEL COMBINA VISTAS DEL MISMO TEMA</text><rect x="25" y="65" width="790" height="285" rx="14" fill="white" stroke="none" stroke-width="2"/><rect x="40" y="90" width="440" height="235" rx="14" fill="#dcebe5" stroke="none" stroke-width="2"/><path d="M55 300L450 115" fill="none" stroke="white" stroke-width="15"/><path d="M60 135L440 305" fill="none" stroke="white" stroke-width="12"/><path d="M286.40000000000003 90Q216.0 170 312.8 325" fill="none" stroke="#9bc9d4" stroke-width="20"/><rect x="505" y="90" width="285" height="65" rx="14" fill="#eef5f1" stroke="none" stroke-width="2"/><text x="525" y="130" font-size="23" fill="#123b46" text-anchor="start">Título y contexto</text><rect x="505" y="170" width="135" height="155" rx="14" fill="#eef5f1" stroke="none" stroke-width="2"/><rect x="655" y="170" width="135" height="155" rx="14" fill="#eef5f1" stroke="none" stroke-width="2"/><rect x="520" y="260" width="23" height="40" rx="2" fill="#176c72" stroke="none" stroke-width="2"/><rect x="552" y="225" width="23" height="75" rx="2" fill="#176c72" stroke="none" stroke-width="2"/><rect x="584" y="200" width="23" height="100" rx="2" fill="#176c72" stroke="none" stroke-width="2"/><text x="672" y="205" font-size="17" fill="#123b46" text-anchor="start">Leyenda</text><text x="672" y="245" font-size="17" fill="#123b46" text-anchor="start">Ríos</text><text x="672" y="280" font-size="17" fill="#123b46" text-anchor="start">Embalses</text><text x="35" y="390" font-size="20" fill="#123b46" text-anchor="start">Esquema de distribución; las barras no representan datos medidos.</text></g></svg>